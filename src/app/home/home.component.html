<div class="large-padding">
    <a routerLink="/listas/{{list.id}}" *ngFor="let list of lists.listas | async" style="text-decoration: none;">
        <article class="card block large-padding top-space with-badge">
            <h4>{{list.titulo}}</h4>
            <div class="badge">
                <span>0</span>
            </div>
        </article>
    </a>
</div>
