<div class="creator-container">
    <!-- Formulario para crear lista -->
    <div class="form-card">
        <h2 class="form-title">
            <i class="fa fa-pencil-square-o" style="color: #2196F3;"></i> Nueva Lista
        </h2>
        
        <div>
            <input 
                type="text" 
                class="custom-input" 
                [(ngModel)]="lista.titulo" 
                (keyup.enter)="save()"
                placeholder="Escribe el nombre de tu lista..."
            >
        </div>

        <button type="button" class="btn-submit" (click)="save()">
            <i class="fa fa-save"></i> Guardar Lista
        </button>

        <div *ngIf="mensaje" style="margin-top: 12px; padding: 10px 14px; background: #dcfce7; color: #166534; border-radius: 6px; font-size: 0.9rem;">
            {{mensaje}}
        </div>
        <div *ngIf="errorMsg" style="margin-top: 12px; padding: 10px 14px; background: #fee2e2; color: #991b1b; border-radius: 6px; font-size: 0.9rem;">
            {{errorMsg}}
        </div>
    </div>
</div>
