<div class="large-padding">
    <input type="text" [(ngModel)]="libro.titulo" placeholder="Nombre de tu libro">
    <div class="top-space">
        <button type="button" class="btn blue light-text full-width" (click)="save()">
            <i class="fa fa-book"></i> Guardar Libro
        </button>
    </div>
    <div *ngIf="mensaje" style="margin-top: 12px; padding: 10px 14px; background: #dcfce7; color: #166534; border-radius: 6px; font-size: 0.9rem;">
        {{mensaje}}
    </div>
    <div *ngIf="errorMsg" style="margin-top: 12px; padding: 10px 14px; background: #fee2e2; color: #991b1b; border-radius: 6px; font-size: 0.9rem;">
        {{errorMsg}}
    </div>
</div>
