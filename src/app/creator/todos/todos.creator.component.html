<div class="text-right">
    <button type="button" class="large-padding pointer no-background light-text" (click)="toggleForm()">
        <span>{{label()}} </span>
        <i class="fa" [ngClass]="icon()"></i>
    </button>
</div>
<div class="lateral-padding" [@openClose]="formState">
    <input type="text" placeholder="Que vas hacer?" [(ngModel)]="todo.content" class="form-control" required min="3">
    <textarea placeholder="Informacion adicional (opcional)" [(ngModel)]="todo.description"
        class="form-control"></textarea>

    <div class="top-space">
        <button type="button" class="btn blue light-text full-width pointer" (click)="save()">
            <i class="fa fa-save"></i>
            Guardar
        </button>
    </div>
</div>
